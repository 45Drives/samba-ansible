---
- name: Ensure /etc/krb5.conf.d/ directory exists
  file:
    path: /etc/krb5.conf.d/
    state: directory
    owner: root
    group: root
    mode: '0755'

- include: firewall.yml

- include: create_ceph_keyring.yml
  when:
    - backend_filesystem == "cephfs"

- include: ctdb.yml
  when:
    - cluster_member | bool

- include: domain_join.yml
  when:
    - domain_member | bool

- include: samba.yml
